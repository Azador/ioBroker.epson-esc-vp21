version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: monthly
    time: "04:00"
    timezone: Europe/Berlin
  open-pull-requests-limit: 20
  assignees:
  - Azador
  versioning-strategy: increase
  ignore:
    # @types/node has to match the minimum supported Node.js version (engines in package.json),
    # otherwise the type check would accept APIs that do not exist there.
    # Remove this rule when the minimum Node.js version is raised.
    - dependency-name: "@types/node"
      update-types: ["version-update:semver-major"]
