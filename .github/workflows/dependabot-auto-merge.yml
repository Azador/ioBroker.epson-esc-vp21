# Dependabot auto-merge, stage 1 of 2:
# Decides whether a Dependabot PR may be merged automatically and marks it with the label "automerge".
# Stage 2 (dependabot-auto-merge-run.yml) merges marked PRs after "Test and Release" succeeded.
#
# Rules:
# - production dependencies: patch updates only
# - development dependencies: patch and minor updates
# Everything else (major updates, minor updates of production dependencies) has to be merged manually.

name: Dependabot auto-merge (check)

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Mark PR for auto-merge
        if: >-
          (steps.metadata.outputs.dependency-type == 'direct:production' &&
           steps.metadata.outputs.update-type == 'version-update:semver-patch') ||
          (steps.metadata.outputs.dependency-type == 'direct:development' &&
           (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'))
        run: gh pr edit "$PR_URL" --add-label automerge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
